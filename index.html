<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>RM's Advent HQ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Patrick+Hand&family=Special+Elite&display=swap">
<style>
/* Layout: one centred phone-width column on pencil-sketch paper; each door is a single meme card, like a panel from her good-morning comics. Single deliberate light look. */
:root {
  --paper: #fbf5ec;
  --paper-2: #f4eadb;
  --ink: #2b2320;
  --ink-soft: #6d605a;
  --pink: #e14f7a;
  --blush: #f9cfd9;
  --gold: #c99a1e;
  --gold-soft: #f3e2a9;
  --burgundy: #7a1f3d;
  --cape: #d42a3d;
  --white: #ffffff;
  --display: "Caveat Brush", "Comic Sans MS", cursive;
  --hand: "Patrick Hand", "Comic Sans MS", system-ui, sans-serif;
  --type: "Special Elite", "Courier New", ui-monospace, monospace;
  color-scheme: light;
}
html { background: var(--paper); }
html, body { min-height: 100%; }
body {
  background: var(--paper);
  background-image:
    radial-gradient(circle at 12% 18%, rgba(225,79,122,.08) 0 2px, transparent 3px),
    radial-gradient(circle at 78% 64%, rgba(201,154,30,.10) 0 2px, transparent 3px),
    repeating-linear-gradient(0deg, transparent 0 31px, rgba(43,35,32,.035) 31px 32px);
  background-size: 140px 140px, 180px 180px, auto;
  color: var(--ink);
  font-family: var(--hand);
  font-size: 18px;
  line-height: 1.4;
}
.wrap {
  max-width: 460px;
  margin: 0 auto;
  padding-block: 22px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid;
  gap: 18px;
}
h1, h2, .brush { font-family: var(--display); font-weight: 400; color: var(--pink); text-wrap: balance; margin: 0; line-height: 1.05; }
h1 { font-size: 2.6rem; }
h2 { font-size: 2rem; }
p { margin: 0; }
.small { font-size: .9rem; color: var(--ink-soft); }
.center { text-align: center; }
.hearts { color: var(--pink); letter-spacing: .3em; }

/* Card: pencil-outlined panel, slightly tilted like a sticker on the page */
.card {
  background: var(--white);
  border: 2.5px solid var(--ink);
  border-radius: 14px 18px 12px 20px / 18px 12px 20px 14px;
  box-shadow: 4px 5px 0 var(--ink);
  padding: 18px;
  display: grid;
  gap: 12px;
  position: relative;
}
.tilt-l { transform: rotate(-1deg); }
.tilt-r { transform: rotate(1deg); }
.label { font-family: var(--type); font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); }
.row { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.row > * { min-width: 0; }
.dots { flex: 1; border-bottom: 2px dotted var(--ink-soft); transform: translateY(-5px); min-width: 20px; }
.stamp {
  font-family: var(--type); text-transform: uppercase; letter-spacing: .1em;
  border: 3px solid var(--pink); color: var(--pink); border-radius: 8px;
  padding: 4px 10px; display: inline-block; transform: rotate(-8deg); font-size: 1.1rem;
  background: rgba(255,255,255,.7);
}
.stamp.gold { border-color: var(--gold); color: var(--gold); }
.code {
  font-family: var(--type); font-size: 1.25rem; letter-spacing: .08em;
  background: var(--paper-2); border: 2px dashed var(--ink); border-radius: 10px;
  padding: 12px; text-align: center; word-break: break-all;
}
.copy { font-family: var(--hand); font-size: 1rem; border: 2px solid var(--ink); background: var(--blush); color: var(--ink); border-radius: 999px; padding: 6px 16px; cursor: pointer; justify-self: center; }
.copy:focus-visible, a:focus-visible { outline: 3px solid var(--pink); outline-offset: 3px; }
.note {
  background: #fff4a8; color: var(--ink); padding: 12px 14px; border-radius: 4px;
  box-shadow: 2px 3px 0 rgba(43,35,32,.25); transform: rotate(1.5deg); font-size: 1.1rem;
}
.sign { font-family: var(--display); font-size: 1.4rem; color: var(--ink); text-align: right; }
.gm { text-align: center; display: grid; gap: 4px; }
.gm .brush { font-size: 2.3rem; }
.cast { display: flex; justify-content: center; align-items: flex-end; gap: 4px; }
.cast svg { height: 120px; width: auto; }
.cast .tiny { height: 80px; }
.speech {
  position: relative; background: var(--white); border: 2px solid var(--ink); border-radius: 16px;
  padding: 6px 12px; font-size: 1rem; max-width: 70%;
}
.redact { background: var(--ink); color: var(--ink); border-radius: 2px; padding: 0 4px; user-select: none; }
ul.ticks { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
ul.ticks li::before { content: "♡ "; color: var(--pink); }

/* Landing */
.doors { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
.door {
  aspect-ratio: 1 / .85; border: 2px solid var(--ink); border-radius: 8px; display: grid; place-items: center; align-content: center; gap: 2px;
  font-family: var(--display); font-size: 1.3rem; background: var(--white); color: var(--ink); min-width: 0; padding: 2px; text-align: center;
}
.door .num { line-height: 1; }
.door .word { font-family: var(--hand); font-size: .82rem; line-height: 1.05; overflow-wrap: anywhere; }
.door.open .num, .door.today .num { font-size: .9rem; opacity: .75; }
.door.today { animation: pop .6s ease-out; }
@keyframes pop { 0% { transform: scale(.8) rotate(-6deg); } 70% { transform: scale(1.08) rotate(2deg); } 100% { transform: none; } }
.door.open { background: var(--blush); color: var(--burgundy); }
.door.today { background: var(--pink); color: var(--white); box-shadow: 0 0 0 3px var(--gold-soft); }
.door.gold { background: var(--gold-soft); }

/* Formats */
.receipt { font-family: var(--type); font-size: .95rem; max-width: 340px; justify-self: center; width: 100%;
  border-radius: 4px; border-top: 6px double var(--ink); border-bottom: 6px double var(--ink); }
.receipt hr { border: 0; border-top: 2px dashed var(--ink-soft); margin: 2px 0; width: 100%; }
.poster { background: var(--burgundy); color: var(--white); text-align: center; }
.poster .label { color: var(--gold-soft); }
.poster h2 { color: var(--gold-soft); font-size: 2.4rem; }
.vs { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
.vs .who { display: grid; gap: 2px; justify-items: center; }
.vs .big { font-family: var(--display); font-size: 2.6rem; color: var(--pink); }
.vs svg { height: 96px; width: auto; }
.poster .white-bg { background: var(--white); border-radius: 50%; padding: 4px; }
.dossier { background: #efe2c4; font-family: var(--type); font-size: .95rem; }
.dossier h2 { font-family: var(--type); color: var(--burgundy); font-size: 1.5rem; letter-spacing: .05em; }
.ticket {
  background: linear-gradient(135deg, #f8e7a6, #e8c55a 50%, #f6e3a0);
  border-style: dashed; text-align: center;
}
.ticket h2 { color: var(--burgundy); font-size: 2.3rem; }
.track { display: grid; gap: 0; }
.step { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; padding-bottom: 12px; position: relative; }
.step .dot { width: 22px; height: 22px; border-radius: 50%; border: 2.5px solid var(--ink); background: var(--white); margin-top: 1px; }
.step.done .dot { background: var(--pink); }
.step.now .dot { background: var(--gold); animation: pulse 1.6s infinite; }
.step:not(:last-child)::after { content: ""; position: absolute; left: 12px; top: 26px; bottom: 2px; border-left: 2.5px dotted var(--ink); }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(201,154,30,.25); } }
.idcard { background: linear-gradient(160deg, #fff, var(--blush)); }
.idcard .grid2 { display: grid; grid-template-columns: 96px 1fr; gap: 12px; align-items: center; }
.idcard .grid2 > div { min-width: 0; }
.photo { border: 2px solid var(--ink); border-radius: 10px; background: var(--white); display: grid; place-items: center; padding: 4px; }
.photo svg { height: 104px; width: auto; }
.rate { display: grid; gap: 6px; }
.rate div { display: flex; gap: 8px; align-items: baseline; }
.rate span:first-child { flex: 1; border-bottom: 2px solid var(--ink-soft); height: 1.2em; }
.screen { background: #17111a; color: #f3e8ee; border-color: #17111a; }
.screen .label { color: #c9a8b8; }
.screen h2 { color: var(--pink); }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.fakebtn { border: 2px solid currentColor; border-radius: 6px; padding: 4px 12px; font-size: .95rem; }
.fakebtn.primary { background: var(--white); color: #17111a; border-color: var(--white); }
.fakebtn.off { opacity: .45; text-decoration: line-through; }
.checkout .fakebtn.off { color: var(--ink-soft); }
.notice { background: linear-gradient(160deg, #fffaf0, #f7ecd0); border-color: var(--gold); box-shadow: 4px 5px 0 var(--gold); text-align: center; }
.notice h2 { font-family: var(--type); color: var(--gold); font-size: 1.3rem; letter-spacing: .15em; }
.seal {
  width: 92px; height: 92px; border-radius: 50%; justify-self: center; display: grid; place-items: center;
  background: radial-gradient(circle at 35% 30%, #fff3c4, var(--gold) 55%, #8f6b0c);
  color: var(--white); font-family: var(--display); font-size: 1.15rem; text-align: center; line-height: 1;
  border: 3px double #fff3c4; box-shadow: 0 0 0 3px var(--gold);
}
.shine { background: linear-gradient(100deg, var(--gold) 20%, #fff3c4 40%, var(--gold) 60%); background-size: 200% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent; animation: shine 3.5s linear infinite; }
@keyframes shine { to { background-position: -200% 0; } }
.locked { text-align: center; }
.countdown { font-family: var(--type); font-size: 1.4rem; }
.fall { position: fixed; top: -30px; color: var(--pink); font-size: 22px; pointer-events: none; animation: fall linear forwards; z-index: 5; }
@keyframes fall { to { transform: translateY(110vh) rotate(260deg); opacity: .2; } }
@media (prefers-reduced-motion: reduce) {
  .step.now .dot, .shine, .fall, .door.today { animation: none; }
  .shine { color: var(--gold); background: none; }
}
.picks { display: grid; gap: 8px; }
.pick { display: grid; grid-template-columns: auto 1fr; column-gap: 10px; align-items: center; text-align: left; font-family: var(--hand); font-size: 1.05rem;
  background: #2a1f2d; color: #f3e8ee; border: 2px solid #4a3a4e; border-radius: 10px; padding: 10px 12px; cursor: pointer; }
.pick span { grid-column: 2; font-size: .9rem; color: #c9a8b8; }
.pick[aria-pressed="true"] { border-color: var(--pink); background: #3d2236; box-shadow: 0 0 0 3px rgba(225,79,122,.35); }
.pick:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px; }
.picked { font-family: var(--display); color: var(--pink); font-size: 1.6rem; text-align: center; }
.preview { display: grid; gap: 6px; }
.preview a { color: var(--burgundy); }
</style>

const TZ = "Asia/Dubai";
const app = document.getElementById("app");
const enc = new TextEncoder();

function todayDubai() {
  try {
    return new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
  } catch (e) { return new Date().toISOString().slice(0, 10); }
}
function readPreview() { try { return localStorage.getItem("rm-enabler") || ""; } catch (e) { return ""; } }
function writePreview(v) { try { localStorage.setItem("rm-enabler", v); } catch (e) {} }

async function sha(str) { return new Uint8Array(await crypto.subtle.digest("SHA-256", enc.encode(str))); }
function hex(b) { return Array.from(b, x => x.toString(16).padStart(2, "0")).join(""); }
function unb64(s) { return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }
async function idFor(token) { return hex(await sha("rm-id:" + token)).slice(0, 16); }
async function open(token, blob) {
  const key = await crypto.subtle.importKey("raw", await sha("rm-enc:" + token), "AES-GCM", false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(blob.iv) }, key, unb64(blob.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

function prettyDate(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(Date.UTC(y, m - 1, d, 12)).toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", timeZone: "UTC" });
}
function daysBetween(a, b) {
  const p = s => { const [y, m, d] = s.split("-").map(Number); return Date.UTC(y, m - 1, d); };
  return Math.round((p(b) - p(a)) / 86400000);
}

function hearts(n) {
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  for (let i = 0; i < n; i++) {
    const h = document.createElement("span");
    h.className = "fall";
    h.textContent = ["♡", "♥", "✦"][i % 3];
    h.style.left = Math.random() * 100 + "vw";
    h.style.animationDuration = 3 + Math.random() * 3 + "s";
    h.style.animationDelay = Math.random() * 1.5 + "s";
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 8000);
  }
}

function wireCopy() {
  app.querySelectorAll("[data-copy]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const text = btn.getAttribute("data-copy");
      try { await navigator.clipboard.writeText(text); btn.textContent = "Copied ♡"; }
      catch (e) {
        const el = btn.previousElementSibling;
        if (el) { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
        btn.textContent = "Selected, now copy it";
      }
    });
  });
}

function wirePicks() {
  app.querySelectorAll("[data-picks]").forEach(group => {
    const out = group.parentElement.querySelector("[data-picked]");
    group.querySelectorAll("[data-pick]").forEach(btn => {
      btn.setAttribute("aria-pressed", "false");
      btn.addEventListener("click", () => {
        group.querySelectorAll("[data-pick]").forEach(b => b.setAttribute("aria-pressed", "false"));
        btn.setAttribute("aria-pressed", "true");
        if (out) { out.hidden = false; out.textContent = "Tonight: " + btn.getAttribute("data-pick") + " ♡"; }
      });
    });
  });
}

function wordsFor() {
  try { return atob(DATA.w).split("").reverse().join("").split("|"); } catch (e) { return []; }
}
function landing(msg) {
  const today = todayDubai();
  const preview = !!readPreview();
  const words = wordsFor();
  let cells = "", sentence = [];
  for (let d = 1; d <= 24; d++) {
    const iso = "2026-12-" + String(d).padStart(2, "0");
    const isOpen = iso <= today || preview;
    const cls = iso === today ? "today" : (isOpen ? "open" : (d === 24 ? "gold" : ""));
    const word = isOpen ? (words[d - 1] || "") : "";
    if (isOpen && word) sentence.push(word);
    cells += `<div class="door ${cls}" aria-label="Door ${d}${word ? ": " + word : ""}"><span class="num">${d}</span>${word ? `<span class="word">${word}</span>` : (d === 24 ? '<span class="word">♡</span>' : "")}</div>`;
  }
  const left = daysBetween(today, "2026-12-24");
  const before = today < "2026-12-01" && !preview;
  const count = before ? `<p class="center">The first door opens on 1 December. Patience, menace.</p>` :
    (left > 0 ? `<p class="center">${left} ${left === 1 ? "day" : "days"} until door 24. No peeking.</p>` :
    (left === 0 ? `<p class="center">Door 24 is open today ♡</p>` : `<p class="center">All 24 doors are open. Menace season complete.</p>`));
  const todayDoor = today >= "2026-12-01" && today <= "2026-12-24" ? Number(today.slice(8)) : 0;
  const banner = todayDoor ? `<div class="note center">Door ${todayDoor} is open: <strong>${words[todayDoor - 1] || ""}</strong> ♡</div>` : "";
  const msgText = sentence.length ? `<div class="card tilt-r"><span class="label">The secret message so far</span><p class="brush" style="font-size:1.9rem;color:var(--ink)">${sentence.join(" ")}${sentence.length < 24 ? " …" : ""}</p><p class="small">One word a day. The full message arrives on 24 December.</p></div>` : "";
  app.innerHTML = `
    <div class="gm"><span class="label">Est. December 2026</span><h1>RM's Advent HQ</h1><p class="small">24 doors · 1 menace · 2 idiots (caged)</p></div>
    ${msg ? `<div class="note">${msg}</div>` : ""}
    ${banner}
    <div class="card tilt-l"><div class="doors">${cells}</div>${count}</div>
    ${msgText}
    <div class="card"><p>Every door hides a word, and some hide a secret page. Scan the card in today's door to open it.</p>
    <p class="small">Secret pages only open with their own QR, and only on their own day. The two idiots are guarding the rest.</p>
    <div class="cast"><svg class="tiny" viewBox="0 0 120 110" role="img" aria-label="The two idiots in their cage"><use href="#idiots"/></svg></div></div>
    <div id="previewbox"></div>`;
  if (todayDoor) hearts(10);
}

async function renderPreviewList(secret) {
  if (!secret || !DATA.preview) return;
  try {
    const list = await open(secret, DATA.preview);
    const box = document.getElementById("previewbox");
    if (!box) return;
    box.innerHTML = `<div class="card"><span class="label">Enabler preview (only on your phone)</span>
      <p class="small">Date locks are off on this phone, so you can test every door.</p>
      <div class="preview">${list.map(x => `<a href="#${x.token}">Day ${x.day}: ${x.title}</a>`).join("")}</div></div>`;
  } catch (e) {}
}

async function route() {
  const token = decodeURIComponent(location.hash.replace(/^#/, ""));
  const preview = readPreview();
  window.scrollTo(0, 0);
  if (!token) { landing(); renderPreviewList(preview); return; }

  if (DATA.preview && token.startsWith("enabler-")) {
    const id = await idFor(token);
    if (id === DATA.preview.id) {
      writePreview(token);
      landing("Enabler mode is on for this phone. Date locks are off here so you can test every door. She won't see this.");
      renderPreviewList(token);
      return;
    }
  }

  const id = await idFor(token);
  const blob = DATA.doors[id];
  if (!blob) {
    landing("That door doesn't exist. The two idiots have been sent to investigate. Scan the QR in today's door instead.");
    renderPreviewList(preview);
    return;
  }
  let door;
  try { door = await open(token, blob); } catch (e) { landing("This QR code looks smudged. Try scanning it again."); return; }

  const today = todayDubai();
  if (today < door.date && !preview) {
    const n = daysBetween(today, door.date);
    app.innerHTML = `
      <div class="card locked tilt-l">
        <span class="label">Door ${door.day} · locked</span>
        <h2>Nice try, menace.</h2>
        <p>This door opens on ${prettyDate(door.date)}.</p>
        <p class="countdown">${n} ${n === 1 ? "sleep" : "sleeps"} to go</p>
        <div class="cast"><svg class="tiny" viewBox="0 0 120 110" role="img" aria-label="The two idiots guarding the door"><use href="#idiots"/></svg></div>
        <p class="small">The two idiots are guarding it. They take this job very seriously.</p>
      </div>
      <p class="center small"><a href="#" style="color:var(--burgundy)">Back to Advent HQ</a></p>`;
    return;
  }
  app.innerHTML = door.html + `<p class="center small"><a href="#" style="color:var(--burgundy)">Back to Advent HQ</a></p>`;
  wireCopy();
  wirePicks();
  hearts(door.day === 24 ? 40 : 14);
}

window.addEventListener("hashchange", route);
if (!DATA) { app.innerHTML = `<div class="card center"><h2>Under construction</h2><p>The Enabler is still building this.</p></div>`; }
else if (!window.crypto || !crypto.subtle) { app.innerHTML = `<div class="card center"><h2>Old browser alert</h2><p>Open this link in Safari or Chrome so the door can unlock.</p></div>`; }
else { route(); }
</script>
